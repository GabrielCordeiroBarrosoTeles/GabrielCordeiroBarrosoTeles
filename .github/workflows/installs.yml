name: Update extension installs

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/installs.yml"

jobs:
  installs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Somar instalações (VS Code Marketplace + Open VSX)
        run: |
          set -euo pipefail
          for ext in reflect-android kit-dev-brasil; do
            vscode=$(curl -sf -X POST 'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json;api-version=7.1-preview.1' \
              -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"GabrielCordeiro.$ext\"}]}],\"flags\":256}" \
              | jq '[.results[0].extensions[0].statistics[] | select(.statisticName == "install") | .value] | first // 0 | floor')
            openvsx=$(curl -sf "https://open-vsx.org/api/GabrielCordeiro/$ext" | jq '.downloadCount // 0')
            total=$((vscode + openvsx))
            echo "$ext: vscode=$vscode openvsx=$openvsx total=$total"
            jq -n --arg msg "$total" \
              '{schemaVersion: 1, label: "instalações", message: $msg, color: "007ACC"}' \
              > "profile/installs-$ext.json"
          done

      - name: Commitar contagem
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/installs-*.json
          git commit -m "chore: update extension installs" || exit 0
          git push
